name: validate and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout web-control
        uses: actions/checkout@v4
        with:
          path: pwc-web-control

      - name: Checkout exact rumiai-os revision
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: 382369cfde55b158bdf9bb8c7c7ba352fb00ca5e
          path: rumiai-os

      - name: Select runner platform and install managed Node.js
        shell: bash
        run: |
          ./rumiai-os/m osarch update
          ./rumiai-os/m pkg install nodejs
          ./rumiai-os/m pkg default nodejs
          ./rumiai-os/m node --version

      - name: Resolve installed Chromium-class browser
        shell: bash
        run: |
          browser=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || :)
          test -n "$browser"
          echo "WEB_CONTROL_BROWSER_EXECUTABLE=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Install pinned JavaScript dependencies
        working-directory: pwc-web-control
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: ../rumiai-os/m npm install

      - name: Run canonical mk lifecycle
        shell: bash
        env:
          WEB_CONTROL_TEST_HEADLESS: '0'
        run: xvfb-run -a ./rumiai-os/m mk --project "$(pwd)/pwc-web-control" check test build

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: pwc-web-control-all
          path: pwc-web-control/dist/pwc-web-control-v*-all.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout web-control
        uses: actions/checkout@v4

      - name: Prepare Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Resolve installed Chromium-class browser
        shell: bash
        run: |
          if [ -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ]; then
            echo "WEB_CONTROL_BROWSER_EXECUTABLE=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
          elif [ -x "/Applications/Chromium.app/Contents/MacOS/Chromium" ]; then
            echo "WEB_CONTROL_BROWSER_EXECUTABLE=/Applications/Chromium.app/Contents/MacOS/Chromium" >> "$GITHUB_ENV"
          else
            echo "No Chromium-class browser available on the macOS runner" >&2
            exit 1
          fi

      - name: Install pinned JavaScript dependencies
        shell: bash
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install

      - name: Validate source and runtime
        shell: bash
        env:
          WEB_CONTROL_TEST_HEADLESS: '0'
        run: |
          node --version
          node --check src/controller.mjs
          node --check src/client.mjs
          node --check tests/run.mjs
          node --check scripts/build-release.mjs
          npm test

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: pwc-web-control-all
          path: artifacts

      - name: Publish versioned release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; no new release created"
            exit 0
          fi
          gh release create "$tag" artifacts/*.tar.gz --target "$GITHUB_SHA" --title "$tag" --generate-notes
