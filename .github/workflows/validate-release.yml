name: validate and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout web-control
        uses: actions/checkout@v4
        with:
          path: rumiai-web-control

      - name: Checkout exact rumiai-os revision
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          repository: massimilianonardi-ai/rumiai-os
          ref: f4d28822c4a2a875bd816ec3b15477dcfa905706
          path: rumiai-os

      - name: Select runner platform and install managed Node.js runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./rumiai-os/m osarch update
          ./rumiai-os/m pkg install nodejs
          ./rumiai-os/m pkg default nodejs
          ./rumiai-os/m node --version

      - name: Prepare Node.js 26 fallback on macOS
        if: runner.os == 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install project dependency on Linux
        if: runner.os == 'Linux'
        working-directory: rumiai-web-control
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: ../rumiai-os/m npm install

      - name: Install project dependency on macOS
        if: runner.os == 'macOS'
        working-directory: rumiai-web-control
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npm install

      - name: Install Playwright Chromium on Linux
        if: runner.os == 'Linux'
        working-directory: rumiai-web-control
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: ../rumiai-os/m npx playwright install --with-deps chromium

      - name: Install Playwright Chromium on macOS
        if: runner.os == 'macOS'
        working-directory: rumiai-web-control
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install chromium

      - name: Run canonical mk lifecycle on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          ./rumiai-os/m mk --project "$(pwd)/rumiai-web-control" check test build

      - name: Run equivalent runtime/build validation on macOS
        if: runner.os == 'macOS'
        working-directory: rumiai-web-control
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          node --version
          node --check src/controller.mjs
          node --check src/client.mjs
          node --check tests/run.mjs
          node --check scripts/build-release.mjs
          npm test
          npm run build

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumiai-web-control-${{ runner.os }}-${{ runner.arch }}
          path: rumiai-web-control/dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish versioned release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; no new release created"
            exit 0
          fi
          gh release create "$tag" artifacts/*.tar.gz --target "$GITHUB_SHA" --title "$tag" --generate-notes
